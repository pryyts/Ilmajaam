<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aadressiotsing</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="page">
  <h1>Aadressiotsing</h1>
  <p class="lead">Sisesta Eesti aadress ja leia selle koordinaadid Maa- ja Ruumiameti aadressiandmete süsteemist (AKS).</p>

  <form id="search-form" class="search-form">
    <label for="address" class="visually-hidden">Aadress</label>
    <input type="text" id="address" name="address" placeholder="Nt Tartu mnt 1, Tallinn" autocomplete="off" required>
    <button type="submit" id="search-btn">Otsi</button>
  </form>

  <div id="status" class="status" role="status" aria-live="polite"></div>

  <section id="result" class="result" hidden>
    <h2 id="result-address"></h2>
    <table class="coords-table">
      <tbody>
        <tr>
          <th>Laiuskraad (WGS84)</th>
          <td id="result-lat"></td>
        </tr>
        <tr>
          <th>Pikkuskraad (WGS84)</th>
          <td id="result-lon"></td>
        </tr>
        <tr>
          <th>L-EST97 X</th>
          <td id="result-x"></td>
        </tr>
        <tr>
          <th>L-EST97 Y</th>
          <td id="result-y"></td>
        </tr>
      </tbody>
    </table>
    <a id="result-map-link" href="#" target="_blank" rel="noopener">Vaata kaardil (OpenStreetMap) →</a>
  </section>

  <footer class="footer">
    Andmeallikas: <a href="https://aks.geoportaal.ee/" target="_blank" rel="noopener">Maa- ja Ruumiameti aadressiandmete süsteem (AKS)</a>
  </footer>
</main>
<script src="app.js"></script>
</body>
</html>
